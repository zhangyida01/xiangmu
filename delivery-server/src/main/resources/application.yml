server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: delivery-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pdm}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
      file-size-threshold: 2MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

pdm:
  master-key-file: ${PDM_MASTER_KEY_FILE:./data/keys/master.key}
  upload-dir: ${PDM_UPLOAD_DIR:./data/uploads}
  jwt-secret: ${PDM_JWT_SECRET:dev-only-secret-key-please-change-in-prod-0123456789}
  jwt-expire-hours: ${PDM_JWT_EXPIRE_HOURS:12}
  init-admin-password: ${PDM_INIT_PASSWORD:Admin@12345}
  captcha-enabled: ${PDM_CAPTCHA_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.pdm: INFO